name: PV Vogel protection Phase 0 arithmetic screening
on:
  pull_request:
    paths:
      - 'studies/pv-vogel-protection-20261017/**'
      - '.github/workflows/pv-vogel-phase0-screening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-screening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Eleven arithmetic and key ledger regression tests
        shell: bash
        run: |
          cd studies/pv-vogel-protection-20261017
          python -m unittest -v test_vogel_study.py
      - name: Generate non-safety screening result
        shell: bash
        run: |
          cd studies/pv-vogel-protection-20261017
          python vogel_study.py > phase0-summary.json
          python -c "import json; d=json.load(open('phase0-summary.json')); assert d['total_cases']==2560; assert d['status']=='ILLUSTRATIVE_SCREENING_ONLY_NOT_A_PROTECTION_VALIDATION'; print('Generated',d['total_cases'],'screening cases')"
      - name: Archive provisional numeric results
        uses: actions/upload-artifact@v4
        with:
          name: pv-vogel-phase0-non-safety-screens
          path: studies/pv-vogel-protection-20261017/phase0-summary.json

  v11-d4-bounded-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout V11 draft source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only pinned GPU Engine reference
        uses: actions/checkout@v4
        with:
          repository: Ventusltd/gpu-drivers-for-global-grid
          ref: bfdc344289c0f03093e0c65979487e9916ea1ef4
          path: gpu-reference
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node 22 for original Kuiper contract tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: NumPy CPU only; no GPU allocation
        run: python -m pip install numpy==2.1.3
      - name: Source pinned CPU, one-billion-index and Phase II regression tests
        shell: bash
        working-directory: studies/pv-vogel-protection-20261017/product-d4
        run: |
          export V11_GPU_ENGINE_DIR="$GITHUB_WORKSPACE/gpu-reference/engine"
          python ../product-d2/standards_license_guard.py .
          python -m unittest -v test_gpu_parameter_sweep.py test_billion_case_contract.py test_phase2_replay.py
          node --test wafer/test_kuiper_core.mjs
      - name: Run bounded static CPU pilot and Phase II evidence proposals
        shell: bash
        working-directory: studies/pv-vogel-protection-20261017/product-d4
        run: |
          export V11_GPU_ENGINE_DIR="$GITHUB_WORKSPACE/gpu-reference/engine"
          python gpu_parameter_sweep.py --backend cpu --receipt results/cpu-parameter-receipt.json
          python billion_case_contract.py --pilot 4096 --receipt results/billion-cpu-pilot.json
          python phase2_replay.py --pilot 4096 --stars 48 --out results/phase2
          python - <<'PY'
          import json
          from billion_case_contract import scheme_sha256
          a=json.load(open('results/billion-cpu-pilot.json'))
          b=json.load(open('results/phase2/phase2-receipt.json'))
          c=json.load(open('results/cpu-parameter-receipt.json'))
          assert a['declared_unique_cases']==1_000_000_000
          assert a['actually_examined_distinct_cases']==4096
          assert a['cuda_cases_executed']==0 and a['ngspice_cases_executed_in_this_pilot']==0
          assert b['actually_pilot_screened']==4096 and b['replay_candidates']==48
          assert a['lattice_sha256']==scheme_sha256()==b['lattice_sha256']
          assert c['cpu_oracle_all_cases']==17640 and c['backend_parity_differences']==0
          assert sum(c['verdict_counts'])==17640
          assert not b['real_cuda_executed'] and b['no_risk_probabilities']
          print("VERIFIED CPU only. 1bn addresses defined, 4096 screened, 48 replays proposed.")
          PY
          python ../product-d2/standards_license_guard.py .
      - name: Upload compact D4 CPU and Phase II receipts
        uses: actions/upload-artifact@v4
        with:
          name: pv-d4-furnace-kuiper-CPU-only-receipts
          path: |
            studies/pv-vogel-protection-20261017/product-d4/results/cpu-parameter-receipt.json
            studies/pv-vogel-protection-20261017/product-d4/results/billion-cpu-pilot.json
            studies/pv-vogel-protection-20261017/product-d4/results/phase2/*.json
