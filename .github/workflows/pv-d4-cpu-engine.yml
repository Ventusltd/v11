name: PV D4 independent CPU baseline and future CuPy readiness
on:
  pull_request:
    paths:
      - 'studies/pv-vogel-protection-20261017/product-d4/**'
      - '.github/workflows/pv-d4-cpu-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-boundary-lattice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout V11 only as active work repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only checkout of existing GPU arithmetic engine at audited SHA
        uses: actions/checkout@v4
        with:
          repository: Ventusltd/gpu-drivers-for-global-grid
          ref: bfdc344289c0f03093e0c65979487e9916ea1ef4
          path: gpu-reference
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU test dependency
        run: python -m pip install numpy==2.1.3
      - name: IEC licence guard: only inspect new original research
        working-directory: studies/pv-vogel-protection-20261017/product-d4
        run: python ../product-d2/standards_license_guard.py .
      - name: Independent scalar corners and pinned original Engine interface
        working-directory: studies/pv-vogel-protection-20261017/product-d4
        run: |
          export V11_GPU_ENGINE_DIR="$GITHUB_WORKSPACE/gpu-reference/engine"
          python -m unittest -v test_gpu_parameter_sweep.py
      - name: Exhaustive 17,640-case CPU proof and compact receipt
        working-directory: studies/pv-vogel-protection-20261017/product-d4
        run: |
          export V11_GPU_ENGINE_DIR="$GITHUB_WORKSPACE/gpu-reference/engine"
          python gpu_parameter_sweep.py --backend cpu --receipt results/cpu-parameter-receipt.json
          python - <<'PY'
          import json
          x=json.load(open("results/cpu-parameter-receipt.json",encoding="utf8"))
          assert x["backend_actually_executed"]=="numpy"
          assert x["distinct_cases"]==17640
          assert x["backend_parity_cases"]==17640
          assert x["cpu_oracle_all_cases"]==17640
          assert x["backend_parity_differences"]==0
          assert sum(x["verdict_counts"])==17640
          assert x["evidence_grade"]=="synthetic_electrical_screen_only"
          assert len(x["input_and_verdict_digest_sha256"])==64
          print("CPU complete, no NVIDIA/CuPy execution falsely claimed")
          PY
      - name: Node 22 for source-pinned Kuiper Belt geometric proofs
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Billion-index source contract and Phase II test integrity
        working-directory: studies/pv-vogel-protection-20261017/product-d4
        run: |
          python -m unittest -v test_billion_case_contract.py test_phase2_replay.py
          node --test wafer/test_kuiper_core.mjs
      - name: Bounded original CPU pilot of billion-case virtual namespace
        working-directory: studies/pv-vogel-protection-20261017/product-d4
        run: |
          python billion_case_contract.py --pilot 4096 --receipt results/billion-cpu-pilot.json
          python phase2_replay.py --pilot 4096 --stars 48 --out results/phase2
          python - <<'PY'
          import json
          from billion_case_contract import scheme_sha256
          a=json.load(open('results/billion-cpu-pilot.json'))
          b=json.load(open('results/phase2/phase2-receipt.json'))
          assert a['declared_unique_cases']==1_000_000_000
          assert a['actually_examined_distinct_cases']==4096
          assert a['cuda_cases_executed']==0 and a['ngspice_cases_executed_in_this_pilot']==0
          assert b['actually_pilot_screened']==4096 and b['replay_candidates']==48
          assert a['lattice_sha256']==scheme_sha256()==b['lattice_sha256']
          assert b['no_risk_probabilities'] and not b['real_cuda_executed']
          print('Indexed one billion; examined 4096; proposed 48 Phase II replays; no CUDA claim')
          PY
      - name: Guard public receipt before upload
        working-directory: studies/pv-vogel-protection-20261017/product-d4
        run: python ../product-d2/standards_license_guard.py .
      - name: Preserve compact CPU verification only
        uses: actions/upload-artifact@v4
        with:
          name: pv-d4-cpu-17k-independent-screen-not-hardware
          path: |
            studies/pv-vogel-protection-20261017/product-d4/results/cpu-parameter-receipt.json
            studies/pv-vogel-protection-20261017/product-d4/results/billion-cpu-pilot.json
            studies/pv-vogel-protection-20261017/product-d4/results/phase2/*.json
