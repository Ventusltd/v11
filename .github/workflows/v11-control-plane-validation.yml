name: V11 Control Plane Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "programme-state.json"
      - "build-plans/**"
      - "capabilities/**"
      - "resources/**"
      - "docs/build-ledger/**"
      - "operator-sessions/**"
      - "browser/**"
      - "reference/**"
      - "scripts/**"
      - "tests/**"
      - "BUILD_PLAN.md"
      - "README.md"
      - "index.html"
      - ".github/workflows/v11-control-plane-validation.yml"
      - ".github/workflows/v11-live-demo.yml"
      - ".github/workflows/v11-tonight-finish-gate.yml"
  push:
    branches:
      - main
    paths:
      - "programme-state.json"
      - "build-plans/**"
      - "capabilities/**"
      - "resources/**"
      - "docs/build-ledger/**"
      - "operator-sessions/**"
      - "browser/**"
      - "reference/**"
      - "scripts/**"
      - "tests/**"
      - "BUILD_PLAN.md"
      - "README.md"
      - "index.html"
      - ".github/workflows/v11-control-plane-validation.yml"
      - ".github/workflows/v11-live-demo.yml"
      - ".github/workflows/v11-tonight-finish-gate.yml"

permissions:
  contents: read

concurrency:
  group: v11-control-plane-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create evidence directory
        run: mkdir -p v11-validation

      - name: Validate machine control plane
        id: validator
        continue-on-error: true
        run: |
          set -o pipefail
          python -S scripts/validate_control_plane.py | tee v11-validation/control-plane.json

      - name: Run six focused tests
        id: tests
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python -S -m unittest -v tests/test_control_plane.py 2>&1 | tee v11-validation/tests.txt

      - name: Check deterministic projections
        id: projections
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python -S scripts/generate_control_plane_projection.py --check | tee v11-validation/projections.txt

      - name: Write validation summary
        if: always()
        env:
          VALIDATOR_RESULT: ${{ steps.validator.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          PROJECTION_RESULT: ${{ steps.projections.outcome }}
        run: |
          python -S - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          tested_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          payload = {
              "schema_version": "globalgrid2050.v11.control-plane-validation.v1",
              "repository": "Ventusltd/v11",
              "tested_commit_sha": tested_sha,
              "workflow_sha": os.environ["GITHUB_SHA"],
              "validator": os.environ["VALIDATOR_RESULT"],
              "six_focused_tests": os.environ["TEST_RESULT"],
              "projection_check": os.environ["PROJECTION_RESULT"],
          }
          payload["pass"] = all(
              payload[key] == "success"
              for key in ("validator", "six_focused_tests", "projection_check")
          )
          Path("v11-validation/summary.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-control-plane-${{ github.run_id }}
          path: v11-validation/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce validation gate
        if: always()
        env:
          VALIDATOR_RESULT: ${{ steps.validator.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          PROJECTION_RESULT: ${{ steps.projections.outcome }}
        run: |
          test "$VALIDATOR_RESULT" = success
          test "$TEST_RESULT" = success
          test "$PROJECTION_RESULT" = success

  browser_e2e:
    name: Visible pinned-Chromium workbench E2E
    if: github.event_name != 'pull_request' || github.head_ref != 'build/v11.2-full-array-sld'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Check out exact review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate E2E syntax
        run: node --check tests/workbench_browser_e2e.mjs

      - name: Restore pinned Chromium cache
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-1.55.0

      - name: Install pinned Playwright Chromium
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.55.0
          if [ "${{ steps.chromium-cache.outputs.cache-hit }}" != "true" ]; then
            node node_modules/playwright-core/cli.js install chromium
          fi
          CHROME_PATH="$(node --input-type=module -e 'import { chromium } from "playwright-core"; process.stdout.write(chromium.executablePath())')"
          test -x "$CHROME_PATH"

      - name: Run bounded browser acceptance
        run: |
          set -euo pipefail
          mkdir -p browser-e2e-evidence
          timeout 100s node tests/workbench_browser_e2e.mjs 2>&1 | tee browser-e2e-evidence/result.json

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-visible-browser-e2e-${{ github.run_id }}
          path: browser-e2e-evidence/
          if-no-files-found: error
          retention-days: 90

  connector_accounting:
    name: Connector accounting authority
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prove Python and browser connector accounting
        run: |
          set -euo pipefail
          mkdir -p connector-accounting-evidence
          python -S -m unittest -v tests/test_connector_accounting.py 2>&1 | tee connector-accounting-evidence/python.txt
          node --test tests/connector_accounting.test.mjs 2>&1 | tee connector-accounting-evidence/browser.txt
          python -S - <<'PY'
          import json
          import os
          from pathlib import Path
          from v11_simulation.connectors import connector_accounting, resistance_accounting

          examples = [connector_accounting(value) for value in (30, 28, 20)]
          payload = {
              "schema_version": "globalgrid2050.v11.connector-accounting-evidence.v1",
              "tested_commit_sha": os.environ["GITHUB_SHA"],
              "examples": examples,
              "default_resistance_policy": resistance_accounting(30, 0.00035),
              "pass": True,
          }
          Path("connector-accounting-evidence/summary.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload connector accounting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-connector-accounting-${{ github.run_id }}
          path: connector-accounting-evidence/
          if-no-files-found: error
          retention-days: 90

  public_endpoint:
    name: Verify immutable public simulator endpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify exact-commit rawcdn endpoints
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          base="https://rawcdn.githack.com/${REPOSITORY}/${TESTED_SHA}/"
          mkdir -p public-endpoint-evidence
          : > public-endpoint-evidence/endpoints.tsv

          fetch() {
            path="$1"
            output="$2"
            headers="$3"
            result="$(curl --retry 3 --retry-all-errors --connect-timeout 10 --max-time 45 \
              -fsSL -D "$headers" -o "$output" \
              -w '%{http_code}\t%{content_type}\t%{size_download}' \
              "${base}${path}")"
            printf '%s\t%s\n' "$path" "$result" >> public-endpoint-evidence/endpoints.tsv
          }

          fetch "browser/workbench.html" public-endpoint-evidence/workbench.html public-endpoint-evidence/workbench.headers
          fetch "browser/workbench.mjs" public-endpoint-evidence/workbench.mjs public-endpoint-evidence/workbench-mjs.headers
          fetch "browser/layout-core.mjs" public-endpoint-evidence/layout-core.mjs public-endpoint-evidence/layout-core.headers
          fetch "browser/layout-simulation-bridge.mjs" public-endpoint-evidence/layout-simulation-bridge.mjs public-endpoint-evidence/layout-bridge.headers
          fetch "browser/workbench-analysis.mjs" public-endpoint-evidence/workbench-analysis.mjs public-endpoint-evidence/workbench-analysis.headers
          fetch "reference/lab_inverter_block_24_strings.json" public-endpoint-evidence/reference.json public-endpoint-evidence/reference.headers

          awk -F '\t' '$2 != "200" { exit 1 }' public-endpoint-evidence/endpoints.tsv
          grep -q "Integrated solar DC workbench" public-endpoint-evidence/workbench.html
          grep -q "simulateComparison" public-endpoint-evidence/workbench.mjs
          grep -q "export function moveModule" public-endpoint-evidence/layout-core.mjs
          grep -q "referenceFromLayout" public-endpoint-evidence/layout-simulation-bridge.mjs
          grep -q "buildEngineeringPackage" public-endpoint-evidence/workbench-analysis.mjs

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("public-endpoint-evidence")
          reference = json.loads((root / "reference.json").read_text())
          assert reference["array"]["string_count"] == 24
          assert reference["array"]["modules_per_string"] == 30

          endpoints = []
          for line in (root / "endpoints.tsv").read_text().splitlines():
              path, status, content_type, size = line.split("\t")
              body_name = {
                  "browser/workbench.html": "workbench.html",
                  "browser/workbench.mjs": "workbench.mjs",
                  "browser/layout-core.mjs": "layout-core.mjs",
                  "browser/layout-simulation-bridge.mjs": "layout-simulation-bridge.mjs",
                  "browser/workbench-analysis.mjs": "workbench-analysis.mjs",
                  "reference/lab_inverter_block_24_strings.json": "reference.json",
              }[path]
              body = (root / body_name).read_bytes()
              endpoints.append({
                  "path": path,
                  "status": int(status),
                  "content_type": content_type,
                  "size_bytes": int(float(size)),
                  "sha256": hashlib.sha256(body).hexdigest(),
              })

          repository = os.environ["REPOSITORY"]
          sha = os.environ["TESTED_SHA"]
          payload = {
              "schema_version": "globalgrid2050.v11.public-endpoint-verification.v1",
              "repository": repository,
              "tested_sha": sha,
              "run_id": int(os.environ["RUN_ID"]),
              "public_demo_url": f"https://rawcdn.githack.com/{repository}/{sha}/browser/workbench.html",
              "all_http_200": all(item["status"] == 200 for item in endpoints),
              "reference_boundary": {
                  "strings": 24,
                  "modules_per_string": 30,
                  "modules": 720,
              },
              "endpoints": endpoints,
          }
          (root / "summary.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload public endpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-public-endpoint-${{ github.run_id }}
          path: public-endpoint-evidence/
          if-no-files-found: error
          retention-days: 90
