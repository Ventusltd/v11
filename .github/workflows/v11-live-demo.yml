name: V11 Live Simulator

on:
  workflow_dispatch:
  push:
    branches: [build/v11-inverter-block-simulator]
    paths:
      - "browser/**"
      - "reference/**"
      - "v11_simulation/**"
      - "scripts/compare_python_js.py"
      - "tests/**"
      - ".github/workflows/v11-live-demo.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: v11-live-simulator-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package live simulator
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact deployment head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.15"
      - name: Run product acceptance tests
        run: |
          set -euo pipefail
          python -S -m unittest -v tests/test_simulation_engine.py tests/test_layout_engine.py tests/test_module_layout_campaign.py
          node --test tests/simulation_core.test.mjs tests/layout_core.test.mjs tests/layout_simulation_bridge.test.mjs tests/workbench_analysis.test.mjs
          python -S scripts/compare_python_js.py --timeout-seconds 20
          node --check browser/workbench.mjs
          node --check browser/layout-simulation-bridge.mjs
          node --check browser/workbench-analysis.mjs
      - name: Build static Pages artifact
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -R browser reference site/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V11 Solar DC Simulator</title><meta http-equiv="refresh" content="0;url=browser/workbench.html"></head><body><p><a href="browser/workbench.html">Open the V11 integrated solar DC workbench</a></p><script>location.replace('browser/workbench.html')</script></body></html>
          HTML
          touch site/.nojekyll
          test -s site/browser/workbench.html
          test -s site/browser/workbench.mjs
          test -s site/browser/layout-core.mjs
          test -s site/browser/layout-simulation-bridge.mjs
          test -s site/browser/workbench-analysis.mjs
          test -s site/reference/lab_inverter_block_24_strings.json
          grep -q "Integrated solar DC workbench" site/browser/workbench.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 7

  deploy:
    name: Publish live simulator
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify public simulator endpoints
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify published HTML, modules and reference
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          TESTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          : "${PAGE_URL:?deploy-pages did not emit page_url}"
          base="${PAGE_URL%/}/"
          mkdir -p live-demo-evidence
          ready=0
          for attempt in {1..30}; do
            if curl -fsSL "${base}browser/workbench.html" -o live-demo-evidence/workbench.html; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          curl -fsSL "$base" -o live-demo-evidence/index.html
          curl -fsSL "${base}browser/workbench.mjs" -o live-demo-evidence/workbench.mjs
          curl -fsSL "${base}browser/layout-core.mjs" -o live-demo-evidence/layout-core.mjs
          curl -fsSL "${base}browser/layout-simulation-bridge.mjs" -o live-demo-evidence/layout-simulation-bridge.mjs
          curl -fsSL "${base}browser/workbench-analysis.mjs" -o live-demo-evidence/workbench-analysis.mjs
          curl -fsSL "${base}reference/lab_inverter_block_24_strings.json" -o live-demo-evidence/reference.json
          grep -q "V11 Solar DC Simulator" live-demo-evidence/index.html
          grep -q "Integrated solar DC workbench" live-demo-evidence/workbench.html
          grep -q "simulateComparison" live-demo-evidence/workbench.mjs
          grep -q "export function moveModule" live-demo-evidence/layout-core.mjs
          grep -q "referenceFromLayout" live-demo-evidence/layout-simulation-bridge.mjs
          grep -q "buildEngineeringPackage" live-demo-evidence/workbench-analysis.mjs
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          reference = json.loads(Path('live-demo-evidence/reference.json').read_text())
          assert reference['array']['string_count'] == 24
          assert reference['array']['modules_per_string'] == 30
          summary = {
              'schema_version': 'globalgrid2050.v11.live-demo-verification.v1',
              'page_url': os.environ['PAGE_URL'],
              'tested_sha': os.environ['TESTED_SHA'],
              'run_id': int(os.environ['RUN_ID']),
              'verified_paths': [
                  '/',
                  '/browser/workbench.html',
                  '/browser/workbench.mjs',
                  '/browser/layout-core.mjs',
                  '/browser/layout-simulation-bridge.mjs',
                  '/browser/workbench-analysis.mjs',
                  '/reference/lab_inverter_block_24_strings.json',
              ],
              'reference_boundary': {'strings': 24, 'modules_per_string': 30, 'modules': 720},
          }
          Path('live-demo-evidence/summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, sort_keys=True))
          PY
      - name: Upload live verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v11-live-verification-${{ github.run_id }}
          path: live-demo-evidence
          if-no-files-found: error
          retention-days: 90
