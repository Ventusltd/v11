<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>V11.2 — 24-String Solar DC SLD</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header id="bar">
    <strong>GLOBALGRID2050 · V11.2 · 24-STRING SOLAR DC SLD</strong>
    <span id="basis">Trina TSM-DEG21C.20 · 2384 × 1303 mm · centre J-box · drawing-only</span>
    <nav>
      <button data-mode="sequential">SEQUENTIAL</button>
      <button data-mode="leapfrog" class="active">LEAPFROG</button>

  <script type="module" src="./app.js"></script>
