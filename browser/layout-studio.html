<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V11 Module Layout Studio</title><style>body{margin:0;background:#0a0d12;color:#eef;font:14px system-ui}main{display:grid;grid-template-columns:320px 1fr;min-height:100vh}.controls{padding:20px;background:#141922}.controls label{display:grid;margin:8px 0}input,select,button{padding:9px;background:#080b10;color:#fff;border:1px solid #394351}button{background:#f2c94c;color:#111;font-weight:800}.stage{padding:20px;overflow:auto}svg{background:#071019;border:1px solid #394351;touch-action:none}.module{fill:#2d9cdb;stroke:#9bdcff;cursor:grab}.selected{fill:#f2c94c}.obstacle{fill:#eb575755;stroke:#eb5757}#status{white-space:pre-wrap;color:#b8c4d0}@media(max-width:800px){main{grid-template-columns:1fr}.stage{order:-1}}</style></head><body><main><aside class="controls"><h1>Module Layout Studio</h1><p>Independent V11 geometry engine. Drag modules, rotate the selected module and assign 30-module strings.</p><label>Boundary width m<input id="bw" type="number" value="48" step="1"></label><label>Boundary height m<input id="bh" type="number" value="28" step="1"></label><label>Module width m<input id="mw" type="number" value="1.134" step="0.001"></label><label>Module height m<input id="mh" type="number" value="2.384" step="0.001"></label><label>Gap X m<input id="gx" type="number" value="0.03" step="0.01"></label><label>Gap Y m<input id="gy" type="number" value="0.05" step="0.01"></label><label>Orientation<select id="orientation"><option>portrait</option><option>landscape</option></select></label><label>Stagger m<input id="stagger" type="number" value="0" step="0.05"></label><button id="fill">Fill boundary</button><button id="rotate">Rotate selected</button><button id="strings">Assign strings</button><button id="export">Export JSON</button><p id="status"></p></aside><section class="stage"><svg id="canvas" width="960" height="560" viewBox="0 0 48 28"></svg></section></main><script type="module" src="./layout-studio.mjs"></script></body></html>
